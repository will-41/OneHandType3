<!DOCTYPE html>
<html>
<head>
    <title>OneType Test</title>
</head>
<body>
    <h1>Direct Test</h1>
    <div id="status">Testing...</div>
    <script>
        // Test if we can access the server
        fetch('http://localhost:5000')
            .then(response => response.text())
            .then(html => {
                document.getElementById('status').innerHTML = 'Server OK - HTML length: ' + html.length;
                
                // Check if React main.tsx is being loaded
                if (html.includes('main.tsx')) {
                    document.getElementById('status').innerHTML += '<br>✅ React file found in HTML';
                } else {
                    document.getElementById('status').innerHTML += '<br>❌ React file NOT found in HTML';
                }
            })
            .catch(error => {
                document.getElementById('status').innerHTML = 'ERROR: ' + error.message;
            });
    </script>
</body>
</html>

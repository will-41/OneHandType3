name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The e2e scripts hardcode /opt/pw-browsers/chromium; point it at Playwright's browser.
      - name: Link Chromium to the path the e2e scripts expect
        run: |
          CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          echo "Playwright chromium: $CHROMIUM"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$CHROMIUM" /opt/pw-browsers/chromium

      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          npx --yes wait-on@8 http://localhost:4173 --timeout 60000

      - name: E2E suites
        run: |
          set -e
          for f in wave-a wave-b-practice wave-b-builder wave-b-pwa wave-c-a11y wave-d-path; do
            if [ -f "e2e/$f.mjs" ]; then
              echo "::group::$f"
              node "e2e/$f.mjs" http://localhost:4173
              echo "::endgroup::"
            fi
          done

      - name: Preview log
        if: failure()
        run: cat preview.log

  android-debug-build:
    # Compiles the Capacitor Android app on every push so Gradle problems
    # surface here, not on the first signed release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onetype-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

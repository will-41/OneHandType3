<!DOCTYPE html>
<html>
<head>
    <title>Navigation Test</title>
</head>
<body>
    <h1>Navigation Test</h1>
    <div id="test-results"></div>
    <script>
        async function testNavigation() {
            const results = document.getElementById('test-results');
            results.innerHTML = 'Testing navigation...';
            
            try {
                // Test if main page loads
                const response = await fetch('http://localhost:5000');
                const html = await response.text();
                
                results.innerHTML += '<br>✅ Server responds';
                
                if (html.includes('OneType')) {
                    results.innerHTML += '<br>✅ OneType content found';
                } else {
                    results.innerHTML += '<br>❌ OneType content missing';
                }
                
                if (html.includes('main.tsx')) {
                    results.innerHTML += '<br>✅ React script found';
                } else {
                    results.innerHTML += '<br>❌ React script missing';
                }
                
            } catch (error) {
                results.innerHTML += '<br>❌ Error: ' + error.message;
            }
        }
        
        testNavigation();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>
</head>
<body>
    <h1>Simple Button Test</h1>
    <button onclick="console.log('SIMPLE BUTTON CLICKED'); alert('Button works!')">Test Button</button>
    
    <script>
        console.log('Debug test page loaded');
        
        // Test if basic console logging works
        console.log('=== BASIC CONSOLE TEST ===');
        console.log('Console logging is working');
        
        // Test if alerts work
        setTimeout(() => {
            console.log('Delayed log after 2 seconds');
        }, 2000);
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background gradient (purple theme matching your screenshots) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1D5DB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" />
  
  <!-- Keyboard (simplified, compact keyboard layout) -->
  <g transform="translate(40, 45)">
    <!-- Top row -->
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="14" y="0" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="28" y="0" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="42" y="0" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="56" y="0" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="70" y="0" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="84" y="0" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="98" y="0" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    
    <!-- Second row -->
    <rect x="0" y="16" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="14" y="16" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="28" y="16" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="42" y="16" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="56" y="16" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="70" y="16" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="84" y="16" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="98" y="16" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    
    <!-- Third row (home row) -->
    <rect x="0" y="32" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="14" y="32" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="28" y="32" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="42" y="32" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="56" y="32" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="70" y="32" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="84" y="32" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="98" y="32" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    
    <!-- Bottom row -->
    <rect x="0" y="48" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="14" y="48" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="28" y="48" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="42" y="48" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="56" y="48" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    <rect x="70" y="48" width="12" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
    
    <!-- Spacebar -->
    <rect x="20" y="64" width="60" height="12" rx="2" fill="url(#keyGradient)" stroke="#D1D5DB" stroke-width="0.5"/>
  </g>
  
  <!-- Hand positioned below keyboard, reaching up to type -->
  <g transform="translate(75, 130)">
    <!-- Palm -->
    <ellipse cx="25" cy="25" rx="20" ry="15" fill="url(#handGradient)" stroke="#9CA3AF" stroke-width="1"/>
    
    <!-- Thumb -->
    <ellipse cx="10" cy="20" rx="6" ry="10" fill="url(#handGradient)" stroke="#9CA3AF" stroke-width="1" transform="rotate(-30 10 20)"/>
    
    <!-- Index finger (pointing up toward keyboard) -->
    <ellipse cx="25" cy="5" rx="4" ry="12" fill="url(#handGradient)" stroke="#9CA3AF" stroke-width="1"/>
    
    <!-- Middle finger -->
    <ellipse cx="32" cy="8" rx="4" ry="10" fill="url(#handGradient)" stroke="#9CA3AF" stroke-width="1"/>
    
    <!-- Ring finger -->
    <ellipse cx="38" cy="12" rx="3" ry="8" fill="url(#handGradient)" stroke="#9CA3AF" stroke-width="1"/>
    
    <!-- Pinky finger -->
    <ellipse cx="43" cy="18" rx="2.5" ry="6" fill="url(#handGradient)" stroke="#9CA3AF" stroke-width="1"/>
    
    <!-- Roman numeral on index finger -->
    <text x="25" y="8" text-anchor="middle" fill="#6B7280" font-family="serif" font-size="6" font-weight="bold">I</text>
  </g>
  
  <!-- App name text (optional, can be removed for just icon) -->
  <text x="100" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">OneType</text>
</svg>